<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#234f62" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="preload" href="%BASE_URL%fonts/ark-pixel-10px-proportional-latin.woff2" as="font" type="font/woff2" crossorigin />
    <link rel="stylesheet" href="%BASE_URL%fonts/ark-pixel-10.css" />
    <meta name="description" content="Pocket World is a pixel sandbox. Populate an island, build settlements and shape the world with seven tools." />
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Pocket World" />
    <meta property="og:title" content="Pocket World — pixel sandbox" />
    <meta property="og:description" content="Pocket World is a pixel sandbox. Populate an island, build settlements and shape the world with seven tools." />
    <!-- Set og:url and an absolute og:image URL when the public domain is chosen. -->
    <meta property="og:image" content="%BASE_URL%og-image.png" />
    <meta property="og:image:type" content="image/png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="A pixel globe with two green islands above the words Pocket World and pixel sandbox on a blue background." />
    <title>Pocket World — pixel sandbox</title>
    <!-- Keep the loading screen visible before the game bundle and fonts arrive. -->
    <style>
      .loading-screen { position: fixed; z-index: 20; inset: 0; display: grid; place-items: center; padding: 24px; background: #234f62; color: #e8e9d8; font: 500 18px/1.5 'Ark Pixel 10', 'Courier New', monospace; text-align: center; cursor: wait; }
      .loading-screen[hidden], .loading-screen [hidden] { display: none !important; }
      .loading-screen[data-mode="create"] { background: #0b1b22cc; }
      .loading-card { box-sizing: border-box; width: min(340px, 100%); padding: 30px 24px; background: #3e4939; border: 3px solid #8b8963; box-shadow: 0 0 0 3px #222e25, inset 3px 3px #69735a, inset -3px -3px #293629, 7px 9px #15271b70; }
      .loading-card img { display: block; width: 64px; height: 64px; margin: 0 auto 16px; image-rendering: pixelated; }
      .loading-title { display: block; color: #f1d58b; font-size: 26px; text-shadow: 2px 2px #253224; }
      .loading-message { margin: 12px 0 8px; font-family: Menlo, Consolas, 'Liberation Mono', monospace; }
      .loading-progress { margin: 0 0 16px; color: #f1d58b; font-size: 24px; font-variant-numeric: tabular-nums; }
      .loading-indicator { display: flex; justify-content: center; gap: 8px; }
      .loading-indicator span { width: 8px; height: 8px; background: #f1d58b; animation: loading-pulse 1s steps(2, end) infinite; }
      .loading-indicator span:nth-child(2) { animation-delay: .15s; }
      .loading-indicator span:nth-child(3) { animation-delay: .3s; }
      .loading-retry { padding: 8px 14px; border: 2px solid #8b8963; background: #26342a; color: #f1d58b; font: inherit; cursor: pointer; }
      .loading-retry:focus-visible { outline: 3px solid #ffe68b; outline-offset: 3px; }
      .loading-screen[data-failed] { cursor: default; }
      .loading-screen[data-failed] .loading-indicator, .loading-screen[data-failed] .loading-progress { display: none; }
      @keyframes loading-pulse { 0%, 100% { opacity: .35; } 50% { opacity: 1; } }
      @media (prefers-reduced-motion: reduce) { .loading-indicator span { animation: none; } }
    </style>
  </head>
  <body>
    <div id="app" inert aria-busy="true"></div>
    <div id="loading-screen" class="loading-screen">
      <div class="loading-card">
        <img src="%BASE_URL%favicon.svg" width="64" height="64" alt="" />
        <strong class="loading-title" translate="no">Pocket World</strong>
        <p id="loading-message" class="loading-message" role="status" aria-live="polite" aria-atomic="true">Loading world…</p>
        <div id="loading-progress" class="loading-progress" role="progressbar" aria-labelledby="loading-message" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0">0%</div>
        <div class="loading-indicator" aria-hidden="true"><span></span><span></span><span></span></div>
        <button id="loading-retry" class="loading-retry" type="button" hidden>Try again</button>
      </div>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
