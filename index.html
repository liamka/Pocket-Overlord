    <title>Pocket Overlord — pixel sandbox</title>
    <!-- Keep the loading screen visible before the game bundle and fonts arrive. -->
    <style>
      .loading-screen { position: fixed; z-index: 20; inset: 0; overflow: hidden; background: #356eb5; color: #ecedc4; font: 400 18px/1.5 'Ark Pixel 10', 'Courier New', monospace; text-align: center; cursor: wait; }
      .loading-screen[hidden], .loading-screen [hidden] { display: none !important; }
      .loading-title { position: absolute; top: 13%; left: 0; width: 100%; font-size: clamp(24px, 5.1vw, 56px); line-height: 1.1; font-weight: 400; }
      .loading-credit { display: block; margin-top: 0; font-size: clamp(14px, 2vw, 20px); line-height: 1.5; opacity: .8; }
      .loading-island { position: absolute; inset: 0; width: 100%; height: 100%; image-rendering: pixelated; pointer-events: none; }

      @media (max-aspect-ratio: 4/5) { .loading-title { font-size: 9vw; } .loading-status { font-size: 3.5vw; } .loading-progress { font-size: 4.5vw; } }

  <body>
    <div id="app" inert aria-busy="true"></div>
    <div id="loading-screen" class="loading-screen">
      <canvas id="loading-island" class="loading-island" width="384" height="216" aria-hidden="true"></canvas>
      <strong class="loading-title" translate="no">Pocket Overlord<span class="loading-credit">Story generator by Kirill Kotikov</span></strong>
      <div class="loading-status">
        <p id="loading-message" class="loading-message" role="status" aria-live="polite" aria-atomic="true">Loading world…</p>
        <div id="loading-progress" class="loading-progress" role="progressbar" aria-labelledby="loading-message" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0">0%</div>
        <button id="loading-retry" class="loading-retry" type="button" hidden>Try again</button>
      </div>
    </div>
    <!-- Render before the game module arrives; the existing progress and visibility own the scene. -->
    <script>
      (() => {
        const screen = document.getElementById('loading-screen');
        const progress = document.getElementById('loading-progress');
        const canvas = document.getElementById('loading-island');
        const ctx = canvas.getContext('2d');
        if (!ctx) return;
        ctx.imageSmoothingEnabled = false;
        const reducedMotion = matchMedia('(prefers-reduced-motion: reduce)');
        const random = (x, y = 0) => { const n = Math.sin(x * 127.1 + y * 311.7) * 43758.5453; return n - Math.floor(n); };
        const smoothNoise = (x, y) => {
          const ix = Math.floor(x), iy = Math.floor(y), fx = x - ix, fy = y - iy;
          const sx = fx * fx * (3 - 2 * fx), sy = fy * fy * (3 - 2 * fy);
          return (random(ix, iy) * (1 - sx) + random(ix + 1, iy) * sx) * (1 - sy)
            + (random(ix, iy + 1) * (1 - sx) + random(ix + 1, iy + 1) * sx) * sy;
        };
        // Match src/render/ocean.ts without waiting for the game bundle.
        const waterColors = ['#83bac7', '#6caccb', '#5999c7', '#4d8bc5', '#427fc0', '#3b76bb', '#356eb5'];
        const waterColor = depth => waterColors[depth < .7 ? 0 : depth < 2.1 ? 1 : depth < 4.8 ? 2 : depth < 8 ? 3 : depth < 13 ? 4 : depth < 19 ? 5 : 6];
        const sea = document.createElement('canvas'), seaCtx = sea.getContext('2d');
        if (!seaCtx) return;
        let originX = 0, originY = 0;
        const rect = (x, y, width, height, color) => { ctx.fillStyle = color; ctx.fillRect(Math.round(x), Math.round(y), width, height); };
        const radius = (x, y) => ((x - 190) / 111) ** 2 + ((y - 117) / 59) ** 2
          + Math.sin(x * .065 + y * .035) * .1 + Math.cos(y * .14) * .07
          + (smoothNoise(x / 19 + 7, y / 17 + 3) - .5) * .14
          + Math.exp(-(((x - 265) / 26) ** 2 + ((y - 160) / 21) ** 2)) * .9;
        const grassy = (x, y) => radius(x, y + 3) < .76 + (smoothNoise(x / 25, y / 19) - .5) * .12;
        const island = document.createElement('canvas'); island.width = 384; island.height = 216;
        const landCtx = island.getContext('2d');
        if (!landCtx) return;
        landCtx.imageSmoothingEnabled = false;
        const landRect = (x, y, width, height, color) => { landCtx.fillStyle = color; landCtx.fillRect(Math.round(x), Math.round(y), width, height); };
        let islandProgress = -1;
        const tiles = [];
        for (let y = 44; y < 192; y += 2) for (let x = 64; x < 324; x += 2) {
          const r = radius(x, y);
          if (r > 1) continue;
          const grass = grassy(x, y), shade = smoothNoise(x / 23 + 13, y / 20 + 5);
          const color = grass ? !grassy(x, y + 2) ? '#536d3d' : !grassy(x, y - 2) ? '#a1b86c'
            : ['#6f9149', '#789b4e', '#83a456', '#8bab5e'][Math.min(3, Math.floor(shade * 4))]
            : grassy(x, y - 2) ? '#8f8059' : grassy(x, y - 4) ? '#b7a375'
            : r > .96 ? '#c4be91' : r > .87 ? '#eadba9' : '#dac78f';
          tiles.push({ x, y, grass, color, detail: random(x, y), threshold: .05 + (x - 64) / 260 * .56 + random(x, y) * .06 });
        }
        let waves = [];
        function resize() {
          const width = screen.clientWidth, height = screen.clientHeight;
          if (!width || !height) return;
          const islandWidth = width / height <= .8 ? width : Math.min(width * .75, 730);
          const scale = Math.max(.5, Math.min(islandWidth / 384, height * .46 / 216));
          canvas.width = sea.width = Math.ceil(width / scale);
          canvas.height = sea.height = Math.ceil(height / scale);
          ctx.imageSmoothingEnabled = false;
          originX = Math.round((canvas.width / 2 - 192) / 4) * 4;
          originY = Math.round((canvas.height * .52 - 108) / 4) * 4;
          for (let y = 0; y < sea.height; y += 4) for (let x = 0; x < sea.width; x += 4) {
            const sx = x - originX, sy = y - originY;
            const offshore = 5 + (smoothNoise(sx / 56 + 17, sy / 56 + 9) * .7 + smoothNoise(sx / 22 + 31, sy / 22 + 5) * .3) * 26;
            const coast = Math.max(0, Math.sqrt(Math.max(0, radius(sx, sy))) - 1) * 48;
            const depth = Math.min(offshore, coast * (.65 + smoothNoise(sx / 26, sy / 26) * .9));
            seaCtx.fillStyle = waterColor(depth);
            seaCtx.fillRect(x, y, 4, 4);
          }
          seaCtx.fillStyle = '#d3e8ed0b';
          for (let y = 0; y < sea.height; y += 4) for (let x = 0; x < sea.width; x += 8) {
            seaCtx.fillRect(x + (y % 8 ? 1 : 4), y + 2, 3, 1);
          }
          waves = Array.from({ length: Math.ceil(canvas.width * canvas.height / 1700) }, (_, i) => ({ x: random(i, 4) * canvas.width, y: random(i, 9) * canvas.height, width: 2 + Math.floor(random(i, 3) * 4) }));
          sync();
        }
        // Native-size crowns: broad two-pixel clusters, stepped light and deep lower foliage.
        // Keep both sizes on the island's pixel grid instead of shrinking a detailed sprite.
        const crowns = [
          [
            '....3344....', '..33455443..', '.2344554432.', '233444433322',
            '234443223432', '234532345443', '.23322345543', '..2222344432',
            '...112333322', '....1122221.', '.....11111..',
          ],
          [
            '.....3344.....', '...33455443...', '..23445554432.', '.2334444444332',
            '23344543322332', '23445543234443', '23444322345543', '.2333222344432',
            '..222223333322', '...1122223321.', '....11122221..', '......11111...',
          ],
        ];
        const treeSprites = [
          ['#28492f', '#3d6934', '#608d39', '#91b84a', '#bed46c'],
          ['#304d2e', '#4e7033', '#79983d', '#a6bd50', '#d0d77a'],
        ].map(colors => crowns.map(crown => {
          const sprite = document.createElement('canvas');
          sprite.width = Math.max(...crown.map(row => row.length)) * 2 + 4;
          sprite.height = crown.length * 2 + 12;
          const painter = sprite.getContext('2d');
          if (!painter) return sprite;
          const trunk = Math.floor(sprite.width / 2) - 2, foot = sprite.height - 3;
          painter.fillStyle = '#304e3340'; painter.fillRect(trunk - 4, foot - 1, 15, 3); painter.fillRect(trunk + 7, foot, 6, 2);
          painter.fillStyle = '#484532'; painter.fillRect(trunk, foot - 14, 5, 14); painter.fillRect(trunk - 2, foot - 2, 9, 2);
          painter.fillStyle = '#8f7950'; painter.fillRect(trunk + 1, foot - 11, 2, 10);
          painter.fillStyle = '#c1a46b'; painter.fillRect(trunk + 1, foot - 8, 1, 6);
          painter.fillStyle = '#484532'; painter.fillRect(trunk - 4, foot - 14, 3, 4); painter.fillRect(trunk - 2, foot - 11, 3, 3);
          crown.forEach((row, y) => [...row].forEach((shade, x) => {
            if (shade === '.') return;
            painter.fillStyle = colors[Number(shade) - 1]; painter.fillRect(x * 2 + 2, y * 2 + 2, 2, 2);
          }));
          return sprite;
        }));
        const trees = [
          [135, 91, .8], [155, 86, .95], [175, 94, .8], [119, 107, .85], [142, 111, 1],
          [163, 113, .9], [180, 112, .75], [122, 130, .8], [145, 133, .9],
          [228, 87, .8], [247, 98, .95], [264, 114, .85], [238, 114, .75],
          [168, 150, .75], [187, 158, .8], [253, 138, .7],
        ].filter(([x, y]) => grassy(x, y)).map(([x, y, scale], i) => ({ x, y, scale, variant: i % 2, threshold: .39 + x / 850 }));
        function tree({ x, y, scale, variant }) {
          const sprite = treeSprites[variant][scale >= .9 ? 1 : 0];
          landCtx.drawImage(sprite, Math.round(x - sprite.width / 2), Math.round(y - sprite.height + 3));
        }
        function house() {
          landCtx.save(); landCtx.translate(215, 132);
          landRect(-16, 3, 41, 4, '#3b553236'); landRect(16, -10, 9, 15, '#3b553228');
          landRect(-17, 0, 37, 4, '#73765c'); landRect(-16, -18, 25, 19, '#e2d9ac');
          landRect(9, -19, 10, 20, '#b8b28a'); landRect(-15, -16, 23, 2, '#a99870');
          landRect(-16, -14, 2, 15, '#b9a57b'); landRect(7, -16, 2, 17, '#938669');
          landRect(10, -35, 5, 13, '#7b7d69'); landRect(9, -36, 7, 3, '#bec0a0'); landRect(10, -35, 3, 1, '#5b665c');
          [[-2, 10], [-5, 18], [-8, 24], [-11, 31], [-14, 36], [-17, 40], [-20, 42]].forEach(([x, width], row) => {
            landRect(x, -32 + row * 2, width, 2, ['#dcaa71', '#d39a62', '#c48a58', '#b77a50', '#ac704c', '#a16548', '#875a43'][row]);
          });
          landRect(-18, -18, 38, 2, '#6c5944'); landRect(-11, -25, 12, 1, '#e1a870');
          landRect(2, -23, 13, 1, '#d69762'); landRect(-15, -21, 11, 1, '#cd8d5d');
          landRect(-11, -12, 6, 6, '#6c725e'); landRect(-10, -11, 4, 3, '#8eb7ae'); landRect(-10, -11, 2, 1, '#d9e4cc');
          landRect(11, -12, 5, 5, '#657566'); landRect(12, -11, 3, 3, '#86a99b');
          landRect(-3, -10, 7, 12, '#75664d'); landRect(-2, -9, 4, 10, '#9c835d'); landRect(1, -4, 1, 1, '#dec58a');
          landRect(-4, 2, 9, 2, '#c5bb91'); landRect(-5, 4, 11, 2, '#a99f7c');
          landRect(-12, -5, 8, 2, '#86734f'); landRect(-11, -6, 2, 1, '#98b061'); landRect(-7, -6, 2, 1, '#cf9a71');
          landCtx.restore();
        }
        function paintIsland(p) {
          landCtx.clearRect(0, 0, island.width, island.height);
          for (const { x, y, grass, color, detail, threshold } of tiles) {
            if (p < threshold) continue;
            landRect(x, y, 2, 2, color);
            if (grass && detail > .96) {
              landRect(x, y, 1, 1, '#b0be76'); landRect(x + 1, y + 1, 1, 1, '#5e7e43');
            } else if (!grass && detail > .94) landRect(x, y, 1, 1, '#baa97c');
          }
          if (p > .72) {
            [[211, 136, 5, 12], [213, 146, 13, 5], [222, 148, 5, 13], [225, 158, 9, 5], [230, 160, 5, 10]].forEach(([x, y, w, h]) => {
              landRect(x, y, w, h, '#ad9866'); landRect(x + 1, y, Math.max(1, w - 2), Math.max(1, h - 1), '#c9b67d');
            });
            [[105, 143], [193, 91], [274, 122]].forEach(([x, y]) => {
              landRect(x, y + 2, 9, 3, '#4a613638'); landRect(x, y - 2, 7, 5, '#78877b');
              landRect(x + 1, y - 4, 4, 3, '#b5b9a0'); landRect(x + 4, y - 1, 3, 3, '#909c89');
            });
          }
          const scenery = trees.map(plant => ({ y: plant.y, threshold: plant.threshold, paint: () => tree(plant) }));
          scenery.push({ y: 132, threshold: .72, paint: house });
          for (const item of scenery.sort((a, b) => a.y - b.y)) if (p > item.threshold) item.paint();
          if (p > .88) {
            landRect(229, 172, 10, 15, '#576d63');
            for (let y = 168; y < 185; y += 3) { landRect(228, y, 10, 2, '#b49a6b'); landRect(229, y, 8, 1, '#d2bc88'); }
            for (const x of [227, 237]) for (const y of [168, 181]) { landRect(x, y, 2, 6, '#6d6550'); landRect(x, y, 2, 2, '#d7c696'); }
          }
        }
        function person(x, y, shirt, hair, stride = 0, hat = false) {
          ctx.save(); ctx.translate(Math.round(x), Math.round(y));
          rect(-3, 0, 8, 2, '#304d3645');
          rect(-2, -4, 2, 4 + stride, '#635e4b'); rect(1, -4, 2, 4 - stride, '#4d5549');
          rect(-2, -1 + stride, 2, 1, '#424e45'); rect(1, -1 - stride, 3, 1, '#424e45');
          rect(-3, -8, 6, 5, shirt); rect(-3, -8, 1, 4, '#ecdfae55');
          rect(-4, -7 - stride, 1, 3, '#d5a576'); rect(3, -7 + stride, 1, 3, '#ebc398');
          rect(-2, -12, 5, 5, '#c69a72'); rect(-1, -11, 4, 3, '#efd0a4');
          rect(-2, -13, 5, 2, hair); rect(-2, -11, 1, 2, hair); rect(2, -10, 1, 1, '#504b3b');
          if (hat) { rect(-2, -15, 5, 2, '#c7a66a'); rect(-4, -13, 9, 2, '#ead39a'); rect(-2, -13, 5, 1, '#a38356'); }
          ctx.restore();
        }
        function villagers(time, progress) {
          const walk = (Math.sin(time / 2200) + 1) / 2, stride = Math.round(Math.sin(time / 160));
          person(184, 128, '#ad6853', '#705441');
          rect(188, 122, 5, 5, '#967448'); rect(188, 122, 5, 1, '#d1ab6f');
          rect(189, 120, 3, 2, '#85a854'); rect(190, 120, 1, 1, '#d9ce8b');
          person(213 + walk * 10, 146 + walk * 6, '#557f98', '#d6b476', stride);
          if (progress > .88) {
            person(233, 178, '#719583', '#786349', 0, true);
            // Stepped rod and line stay on the same pixel grid as the jetty.
            [[236, 172], [238, 169], [240, 166], [242, 163]].forEach(([x, y]) => rect(x, y, 1, 4, '#8f7951'));
            rect(243, 163, 1, 7, '#d4ddbd90'); rect(244, 170, 1, 8, '#d4ddbd90');
            rect(245, 178, 1, 5, '#d4ddbd90'); rect(244, 183, 3, 1, '#d19b65');
            rect(241, 185, 3, 1, '#d0e6d876'); rect(247, 184, 3, 1, '#d0e6d876');
          }
        }
        // Small standalone flight frames are ready before the game module loads.
        function pixelShape(painter, color, points) {
          painter.fillStyle = color;
          const ys = points.map(point => point[1]);
          for (let y = Math.floor(Math.min(...ys)); y < Math.max(...ys); y++) {
            const crossings = [];
            for (let i = 0; i < points.length; i++) {
              const a = points[i], b = points[(i + 1) % points.length];
              if ((a[1] <= y + .5 && b[1] > y + .5) || (b[1] <= y + .5 && a[1] > y + .5)) {
                crossings.push(a[0] + (y + .5 - a[1]) / (b[1] - a[1]) * (b[0] - a[0]));
              }
            }
            crossings.sort((a, b) => a - b);
            for (let i = 0; i + 1 < crossings.length; i += 2) painter.fillRect(Math.round(crossings[i]), y, Math.max(1, Math.round(crossings[i + 1]) - Math.round(crossings[i])), 1);
          }
        }
        const wingPoses = [1, .88, .66, .43, .3, .43, .66, .88];
        const dragonFrames = wingPoses.map((spread, frame) => {
          const sprite = document.createElement('canvas'); sprite.width = 104; sprite.height = 96;
          const painter = sprite.getContext('2d');
          if (!painter) return sprite;
          painter.translate(52, 48);
          const phase = frame / wingPoses.length * Math.PI * 2;
          const shape = (color, points) => pixelShape(painter, color, points);
          const wing = side => {
            const paint = (color, points) => shape(color, points.map(([x, y]) => [
              Math.round(x - Math.sin(phase) * Math.max(0, y - 6) * .1),
              Math.round(y * side * spread * (side < 0 ? .86 : 1)),
            ]));

            paint('#492a2b', [[4, 2], [12, 16], [6, 29], [-5, 44], [-9, 40], [-40, 30], [-32, 24], [-35, 13], [-25, 18], [-20, 8], [-12, 13], [-8, 1]]);
            paint(side < 0 ? '#96372e' : '#bb3b2f', [[3, 4], [9, 16], [3, 28], [-6, 40], [-35, 29], [-28, 24], [-31, 17], [-24, 21], [-19, 12], [-11, 16], [-6, 4]]);
            paint(side < 0 ? '#bc5734' : '#df793d', [[5, 17], [-7, 36], [-32, 29], [-25, 24], [-27, 20], [-21, 24], [-17, 15], [-10, 19], [-5, 8]]);
            paint(side < 0 ? '#d88b4c' : '#f0af59', [[2, 18], [-8, 33], [-27, 29], [-18, 27], [-13, 22]]);
            paint('#792e2b', [[5, 15], [-8, 38], [-11, 37], [0, 18]]);
            paint('#96332a', [[3, 15], [-24, 26], [-32, 29], [-27, 29], [-21, 26], [5, 18]]);
            paint('#f28a48', [[3, 5], [10, 16], [4, 28], [-6, 41], [-7, 37], [1, 26], [7, 16], [1, 7]]);
            paint('#f0d3a0', [[10, 13], [16, 10], [14, 17], [10, 18]]);
          };
          wing(-1);
          const tail = (color, points) => shape(color, points.map(([x, y]) => [x, y + Math.round(Math.sin(phase + x / 15) * Math.max(0, -x - 10) * .08)]));
          tail('#492a2b', [[-9, -4], [-21, -2], [-29, 8], [-36, 11], [-41, 6], [-42, -1], [-48, 5], [-43, 7], [-42, 14], [-35, 18], [-27, 15], [-17, 6], [-7, 5]]);
          tail('#ad362d', [[-10, -2], [-20, 0], [-28, 10], [-35, 14], [-40, 10], [-40, 13], [-35, 16], [-28, 13], [-17, 3], [-8, 3]]);
          tail('#ed8144', [[-12, -1], [-20, 1], [-29, 11], [-25, 9], [-17, 2], [-10, 2]]);
          for (const side of [-1, 1]) {
            shape('#622a28', [[-10, side * 3], [-18, side * 10], [-14, side * 15], [-5, side * 15], [-3, side * 12], [-11, side * 11], [-4, side * 4]]);
            shape('#c34c31', [[-10, side * 6], [-15, side * 10], [-12, side * 13], [-5, side * 13], [-11, side * 10], [-6, side * 6]]);
            shape('#f0d3a0', [[-7, side * 13], [-3, side * 13], [-3, side * 16], [-5, side * 14], [-7, side * 16]]);
          }
          shape('#492a2b', [[-18, -4], [-8, -10], [8, -9], [18, -4], [22, -12], [32, -12], [35, -8], [42, -7], [45, -3], [44, 3], [35, 5], [27, 2], [20, 6], [12, 10], [-5, 8], [-15, 3]]);
          shape('#b5362d', [[-16, -3], [-7, -8], [7, -7], [18, -1], [24, -10], [31, -10], [34, -6], [41, -5], [43, -2], [42, 2], [35, 3], [26, 0], [18, 5], [11, 8], [-4, 6], [-13, 2]]);

          shape('#f0954d', [[-10, -4], [-5, -6], [5, -5], [10, -2], [4, -1], [-4, -2]]);

        function dragon(time) {

          rect(-15, -8, 7, 5, '#4c8873'); rect(-14, -9, 5, 2, '#83ac81');
          rect(-14, -5, 5, 2, '#356c63'); rect(8, -5, 4, 3, '#7d6c4f');
          rect(0, -38, 2, 37, '#75684f'); rect(0, -37, 1, 32, '#c4b383');

          rect(2, -39, 7, 2, '#5e9d82'); rect(2, -37, 5, 2, '#8bbe94');

        function draw(time) {
          const p = Math.max(0, Math.min(1, Number(progress.getAttribute('aria-valuenow')) / 100));
          ctx.drawImage(sea, 0, 0);
          waves.forEach((wave, i) => rect(wave.x + Math.floor(Math.sin(time / 1600 + i) * 2), wave.y, wave.width, 1, '#d3e8ed18'));
          ctx.save(); ctx.translate(originX, originY);
          if (p !== islandProgress) { paintIsland(p); islandProgress = p; }

          dragon(time);

        let frameId = 0, lastPaint = 0;
        const animating = () => !screen.hidden && !document.hidden && !screen.hasAttribute('data-failed') && !reducedMotion.matches;

          if (!animating()) return;
          if (time - lastPaint >= 80) { draw(time); lastPaint = time; }
          frameId = requestAnimationFrame(frame);
        }

        observer.observe(screen, { attributes: true, attributeFilter: ['hidden', 'data-failed'] });
