<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#234f62" />
    <meta name="robots" content="noindex" />
    <title>20 favicon options | Pocket World</title>
    <link id="tab-icon" rel="icon" type="image/svg+xml" href="./favicon.svg" />
    <link rel="stylesheet" href="./fonts/ark-pixel-10.css" />
    <style>
      :root { font-family: 'Ark Pixel 10', 'Courier New', monospace; color: #eee7be; background: #234f62; color-scheme: dark; font-synthesis: none; }
      :root:lang(zh-CN) { font-family: 'PingFang SC', 'Microsoft YaHei', sans-serif; }
      :root:lang(ja) { font-family: 'Hiragino Kaku Gothic ProN', 'Yu Gothic', sans-serif; }
      * { box-sizing: border-box; }
      body { margin: 0; padding-bottom: 118px; }
      [hidden] { display: none !important; }
      a { color: inherit; }
      button, a { -webkit-tap-highlight-color: transparent; }
      button { font: inherit; color: inherit; cursor: pointer; }
      button:focus-visible, a:focus-visible { outline: 3px solid #ffe19a; outline-offset: 5px; }
      img { image-rendering: pixelated; }
      .wrap { width: min(1264px, calc(100% - 64px)); margin-inline: auto; }
      .masthead { display: flex; justify-content: space-between; align-items: center; gap: 20px; padding-block: 26px; border-bottom: 2px solid #396979; }
      .brand { display: flex; align-items: center; gap: 12px; font-size: 21px; }
      .brand img { width: 32px; height: 32px; }
      .back { font-size: 16px; text-underline-offset: 5px; }
      .intro { display: flex; justify-content: space-between; align-items: center; gap: 32px; padding-block: 40px 30px; }
      h1 { margin: 0 0 12px; font-size: clamp(32px, 4vw, 52px); font-weight: 500; line-height: 1.08; }
      .intro p { margin: 0; max-width: 620px; color: #bed6d7; font-size: 18px; line-height: 1.5; }
      .current { display: flex; align-items: center; gap: 14px; flex-shrink: 0; padding: 14px 18px; background: #1c4151; border: 2px solid #396979; }
      .current img { width: 32px; height: 32px; }
      .current span { font-size: 16px; color: #bed6d7; }
      .gallery { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 18px; }
      .option { display: block; min-width: 0; width: 100%; padding: 0; text-align: left; background: #4c5142; border: 2px solid #192d2c; box-shadow: inset 0 0 0 2px #84836a, 3px 3px 0 #173a48; }
      .option:hover { border-color: #e9cb7c; }
      .option[aria-pressed="true"] { border-color: #ffe19a; box-shadow: 0 0 0 2px #d5ab57, 3px 3px 0 #173a48; }
      .option-heading { display: flex; align-items: baseline; gap: 10px; padding: 14px 14px 12px; min-height: 51px; }
      .number { color: #c6c9a9; font-size: 14px; font-variant-numeric: tabular-nums; }
      .name { font-size: 18px; line-height: 1.2; }
      .art { display: grid; place-items: center; height: 144px; margin: 0 8px; background: #263a37; border: 1px solid #62705b; }
      .art img { width: 96px; height: 96px; }
      .samples { display: grid; grid-template-columns: 1fr 1fr; margin: 8px; border: 1px solid #62705b; }
      .sample { display: flex; justify-content: center; align-items: end; gap: 22px; padding: 12px 8px 8px; }
      .sample-light { background: #f0f0df; color: #344b48; }
      .sample-dark { background: #192c33; color: #c0d1d1; }
      .size { display: grid; justify-items: center; align-content: end; gap: 7px; font-family: system-ui, sans-serif; font-size: 10px; line-height: 1; }
      .size-16 { width: 16px; height: 16px; }
      .size-32 { width: 32px; height: 32px; }
      .choice { display: flex; align-items: center; justify-content: space-between; padding: 5px 15px 15px; color: #d2d7bd; font-size: 14px; }
      .choice-mark { width: 12px; height: 12px; border: 2px solid #a0a789; background: #2b3931; }
      .option[aria-pressed="true"] .choice-mark { border-color: #ffe19a; background: #d5ab57; box-shadow: inset 0 0 0 2px #4c5142; }
      .option[aria-pressed="true"] .choice { color: #ffe19a; }
      .note { margin: 24px 0 8px; color: #bed6d7; font-size: 15px; line-height: 1.5; }
      .preview-bar { position: fixed; z-index: 2; bottom: 0; inset-inline: 0; background: #303e32; border-top: 2px solid #9b9870; box-shadow: 0 -4px 0 #192d2c; }
      .preview-content { display: flex; justify-content: space-between; align-items: center; gap: 20px; padding-block: 16px; min-height: 90px; }
      .selection { display: flex; align-items: center; gap: 14px; min-width: 0; }
      .selection img { width: 40px; height: 40px; flex-shrink: 0; }
      .selection strong { display: block; color: #ffe19a; font-size: 20px; font-weight: 500; }
      .selection small { display: block; margin-top: 5px; color: #c1ccb0; font-size: 14px; }
      .download { flex-shrink: 0; padding: 12px 18px; color: #f4e4b8; background: #4c5142; border: 2px solid #a49b6c; box-shadow: inset 2px 2px 0 #6d7357, inset -2px -2px 0 #202d25; text-decoration: none; font-size: 17px; }
      .download:hover { background: #626b50; }
      @media (min-width: 1600px) { .wrap { width: min(1520px, calc(100% - 96px)); } .gallery { grid-template-columns: repeat(5, minmax(0, 1fr)); } }
      @media (max-width: 1050px) { .gallery { grid-template-columns: repeat(3, minmax(0, 1fr)); } }
      @media (max-width: 760px) {
        .wrap { width: calc(100% - 32px); }
        .intro { align-items: start; padding-block: 28px 24px; }
        .intro p { font-size: 16px; }
        .current { display: none; }
        .gallery { grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 14px; }
        .option-heading { gap: 7px; padding-inline: 10px; }
        .name { font-size: 16px; }
        .sample { gap: 10px; padding-inline: 4px; }
        .selection strong { font-size: 17px; }
        .selection small { font-size: 12px; }
        .download { font-size: 15px; padding: 12px; }
      }
      @media (max-width: 400px) {
        .gallery { grid-template-columns: 1fr; }
        .art { height: 144px; }
        .sample { gap: 32px; }
        .brand { font-size: 18px; }
        .selection img { width: 32px; height: 32px; }
        .selection { gap: 9px; }
        .preview-content { gap: 10px; }
        .download { font-size: 13px; padding: 10px; }
      }
    </style>
  </head>
  <body>
    <header class="masthead wrap">
      <div class="brand"><img src="./favicon.svg" alt="" />Pocket World</div>
      <a class="back" href="./" data-copy="back">Back to the game</a>
    </header>
    <main class="wrap">
      <div class="intro">
        <div>
          <h1 data-copy="title">20 small worlds.</h1>
          <p data-copy="intro">Choose a favicon to preview in this browser tab.</p>
        </div>
        <div class="current"><img src="./favicon.svg" alt="" /><span data-copy="current">Current favicon</span></div>
      </div>
      <div id="gallery" class="gallery" role="group" aria-label="Favicon options"></div>
      <p class="note" data-copy="note">Compare each option at 16 and 32 px on light and dark backgrounds. Previewing only changes this tab.</p>
      <noscript><p>Enable JavaScript to view the 20 favicon options.</p></noscript>
    </main>
    <footer class="preview-bar">
      <div class="preview-content wrap">
        <div class="selection">
          <img id="selected-icon" src="./favicon.svg" alt="" />
          <div role="status"><strong id="selected-name">Current favicon</strong><small id="selected-hint">Select an option above.</small></div>
        </div>
        <a id="download" class="download" hidden download data-copy="download">Download SVG</a>
      </div>
    </footer>
    <script type="module">
      const options = [
        'pocket-planet', 'sunny-island', 'floating-island', 'old-oak', 'tiny-kingdom',
        'sandbox', 'volcano', 'snow-peak', 'new-life', 'archipelago',
        'world-crown', 'world-in-hand', 'moonlit-world', 'four-seasons', 'cube-world',
        'first-village', 'pine-island', 'shooting-star', 'world-portal', 'pocket-world-mark',
      ];
      const translations = {
        en: {
          title: '20 small worlds.', intro: 'Choose a favicon to preview in this browser tab.', back: 'Back to the game', current: 'Current favicon',
          note: 'Compare each option at 16 and 32 px on light and dark backgrounds. Previewing only changes this tab.',
          download: 'Download SVG', empty: 'Select an option above.', active: 'Previewing in this browser tab.', preview: 'Preview in tab', selected: 'Previewing', group: 'Favicon options',
          names: ['Pocket planet', 'Sunny island', 'Floating island', 'Old oak', 'Tiny kingdom', 'Sandbox', 'Volcano', 'Snow peak', 'New life', 'Archipelago', 'World crown', 'World in hand', 'Moonlit world', 'Four seasons', 'Cube world', 'First village', 'Pine island', 'Shooting star', 'World portal', 'Pocket World mark'],
        },
        ru: {
          title: '20 маленьких миров.', intro: 'Выберите фавиконку для просмотра во вкладке браузера.', back: 'Вернуться в игру', current: 'Текущая фавиконка',
          note: 'Сравните варианты в размерах 16 и 32 px на светлом и тёмном фоне. Просмотр меняет только эту вкладку.',
          download: 'Скачать SVG', empty: 'Выберите вариант выше.', active: 'Просмотр во вкладке браузера.', preview: 'Примерить во вкладке', selected: 'На просмотре', group: 'Варианты фавиконки',
          names: ['Карманная планета', 'Солнечный остров', 'Парящий остров', 'Старый дуб', 'Маленькое королевство', 'Песочница', 'Вулкан', 'Снежная вершина', 'Новая жизнь', 'Архипелаг', 'Корона мира', 'Мир в ладони', 'Лунный мир', 'Четыре сезона', 'Кубический мир', 'Первая деревня', 'Сосновый остров', 'Падающая звезда', 'Портал в мир', 'Знак Pocket World'],
        },
        'zh-CN': {
          title: '20 个小世界。', intro: '选择网站图标，在此浏览器标签页中预览。', back: '返回游戏', current: '当前图标',
          note: '在浅色和深色背景上比较 16 和 32 px 的图标。预览仅改变当前标签页。',
          download: '下载 SVG', empty: '请选择上方的图标。', active: '正在此标签页中预览。', preview: '在标签页中预览', selected: '预览中', group: '网站图标选项',
          names: ['口袋星球', '阳光小岛', '浮空岛', '老橡树', '小小王国', '沙盒', '火山', '雪峰', '新生命', '群岛', '世界王冠', '掌中世界', '月光世界', '四季', '方块世界', '第一座村庄', '松树岛', '流星', '世界之门', 'Pocket World 标志'],
        },
        ja: {
          title: '20 の小さな世界。', intro: 'ファビコンを選ぶと、このブラウザータブでプレビューできます。', back: 'ゲームに戻る', current: '現在のファビコン',
          note: '明るい背景と暗い背景で、16 px と 32 px のアイコンを比較できます。プレビューはこのタブにのみ反映されます。',
          download: 'SVG を保存', empty: '上から選んでください。', active: 'このタブでプレビュー中。', preview: 'タブでプレビュー', selected: 'プレビュー中', group: 'ファビコンの候補',
          names: ['ポケット惑星', '陽だまりの島', '浮かぶ島', '古い樫の木', '小さな王国', '砂場', '火山', '雪の峰', '新しい命', '群島', '世界の王冠', '手のひらの世界', '月夜の世界', '四季', 'キューブ世界', '最初の村', '松の島', '流れ星', '世界への扉', 'Pocket World ロゴ'],
        },
        es: {
          title: '20 pequeños mundos.', intro: 'Elige un favicon para verlo en esta pestaña del navegador.', back: 'Volver al juego', current: 'Favicon actual',
          note: 'Compara cada opción a 16 y 32 px sobre fondos claros y oscuros. La vista previa solo cambia esta pestaña.',
          download: 'Descargar SVG', empty: 'Elige una opción arriba.', active: 'Vista previa en esta pestaña.', preview: 'Ver en la pestaña', selected: 'En vista previa', group: 'Opciones de favicon',
          names: ['Planeta de bolsillo', 'Isla soleada', 'Isla flotante', 'Viejo roble', 'Pequeño reino', 'Caja de arena', 'Volcán', 'Pico nevado', 'Nueva vida', 'Archipiélago', 'Corona del mundo', 'Mundo en la mano', 'Mundo lunar', 'Cuatro estaciones', 'Mundo cúbico', 'Primera aldea', 'Isla de pinos', 'Estrella fugaz', 'Portal del mundo', 'Símbolo Pocket World'],
        },
      };
      let language = 'en';
      try {
        // Use the game's original storage key to preserve the selected language.
        const saved = localStorage.getItem('little-world:language');
        if (Object.hasOwn(translations, saved)) language = saved;
      } catch { /* The gallery works when storage is unavailable. */ }
      const copy = translations[language];
      document.documentElement.lang = language;
      document.title = `${copy.title} | Pocket World`;
      for (const element of document.querySelectorAll('[data-copy]')) element.textContent = copy[element.dataset.copy];
      const gallery = document.querySelector('#gallery');
      gallery.setAttribute('aria-label', copy.group);
      document.querySelector('#selected-name').textContent = copy.current;
      document.querySelector('#selected-hint').textContent = copy.empty;

      const number = index => String(index + 1).padStart(2, '0');
      const source = index => `./favicon-options/${number(index)}-${options[index]}.svg`;
      const sample = (src, theme) => `<span class="sample sample-${theme}"><span class="size"><img src="${src}" class="size-16" alt="" width="16" height="16" />16</span><span class="size"><img src="${src}" class="size-32" alt="" width="32" height="32" />32</span></span>`;
      for (const [index, slug] of options.entries()) {
        const button = document.createElement('button');
        button.type = 'button';
        button.className = 'option';
        button.id = `option-${number(index)}`;
        button.dataset.index = index;
        button.setAttribute('aria-pressed', 'false');
        button.setAttribute('aria-label', `${number(index)}. ${copy.names[index]}. ${copy.preview}`);
        const src = source(index);
        button.innerHTML = `<span class="option-heading"><span class="number">${number(index)}</span><span class="name">${copy.names[index]}</span></span><span class="art"><img src="${src}" alt="" width="96" height="96" /></span><span class="samples">${sample(src, 'light')}${sample(src, 'dark')}</span><span class="choice"><span class="choice-label">${copy.preview}</span><span class="choice-mark" aria-hidden="true"></span></span>`;
        gallery.append(button);
      }

      function select(index) {
        if (!Number.isInteger(index) || index < 0 || index >= options.length) return;
        for (const button of gallery.children) {
          const selected = Number(button.dataset.index) === index;
          button.setAttribute('aria-pressed', String(selected));
          button.querySelector('.choice-label').textContent = selected ? copy.selected : copy.preview;
        }
        const src = source(index);
        document.querySelector('#tab-icon').href = src;
        document.querySelector('#selected-icon').src = src;
        document.querySelector('#selected-name').textContent = `${number(index)}. ${copy.names[index]}`;
        document.querySelector('#selected-hint').textContent = copy.active;
        document.title = `${number(index)}. ${copy.names[index]} | Pocket World`;
        const download = document.querySelector('#download');
        download.href = src;
        download.download = `${number(index)}-${options[index]}.svg`;
        download.hidden = false;
        history.replaceState(null, '', `#option-${number(index)}`);
      }
      gallery.addEventListener('click', event => {
        const button = event.target.closest('button[data-index]');
        if (button) select(Number(button.dataset.index));
      });
      function restoreSelection() {
        const match = /^#option-(\d{2})$/.exec(location.hash);
        if (match) select(Number(match[1]) - 1);
      }
      restoreSelection();
      window.addEventListener('hashchange', restoreSelection);
    </script>
  </body>
</html>
